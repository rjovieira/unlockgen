name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python implementation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test vectors
        run: python unlockgen.py --test
      - name: Doctests
        run: python -m doctest unlockgen.py

  parity:
    name: Browser port matches the Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Cross-check 50000 IMEIs against unlockgen.py
        run: node tests/parity.mjs 50000
